name: Release

# Manual until the azohra npm scope exists and its trusted publisher is
# configured; then restore the tag trigger:
#   push:
#     tags: ["v*"]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Guard tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match package version $VERSION" >&2
            exit 1
          fi
      - name: Publish with provenance
        run: pnpm publish --provenance --no-git-checks
